name: Bug report
description: Report a reproducible software or interface problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true

  - type: input
    attributes:
      label: Browser and operating system

  - type: textarea
    attributes:
      label: Additional context
