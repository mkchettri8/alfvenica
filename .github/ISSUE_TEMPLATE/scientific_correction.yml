name: Scientific correction
description: Propose a formula, convention, reference, or validation correction
title: "[Science] "
labels: [science]
body:
  - type: textarea
    attributes:
      label: Formula or calculator
      description: Give the displayed name and formula ID or URL, if available.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current issue
      description: State the suspected error or ambiguity precisely.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Authoritative reference or derivation
      description: Link the primary paper, DOI, formulary section, or derivation that supports the report.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected result
      description: State the corrected equation, value, unit, convention, wording, or behaviour.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction values
      description: List the unit system, every input value, the current output, and any independent benchmark.
    validations:
      required: true
